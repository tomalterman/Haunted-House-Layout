<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gym Haunted House Layout</title>
    <meta name="description" content="To-scale 2D and 3D layout of the gym haunted house walls, tents, and visitor route." />
    <link rel="stylesheet" href="src/styles.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js" } }
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="title">
        <h1>Gym Haunted House</h1>
        <p id="subtitle">To scale</p>
      </div>
      <div class="controls">
        <div class="segmented" role="group" aria-label="View">
          <button type="button" id="view-2d" aria-pressed="true">2D</button>
          <button type="button" id="view-3d" aria-pressed="false">3D</button>
        </div>
        <label class="check" for="show-route">
          <input type="checkbox" id="show-route" checked />
          <span>Route</span>
        </label>
        <label class="check" for="show-measurements">
          <input type="checkbox" id="show-measurements" checked />
          <span>Measurements</span>
        </label>
        <label class="check" for="show-groups">
          <input type="checkbox" id="show-groups" />
          <span>Groups</span>
        </label>
        <button type="button" id="reset-view" class="plain" hidden>Reset view</button>
      </div>
    </header>
    <ul class="legend" aria-label="Legend">
      <li><i class="sw sw-wall"></i>Wall</li>
      <li><i class="sw sw-tent"></i>Tent (closed sides)</li>
      <li><i class="sw sw-route"></i>Visitor route</li>
      <li><i class="sw sw-off"></i>Off route</li>
    </ul>
    <ul id="group-panel" class="group-panel" aria-label="Group areas" hidden></ul>
    <main class="views">
      <section id="plan-2d" class="view" aria-label="2D plan"></section>
      <section id="plan-3d" class="view" aria-label="3D model" hidden></section>
      <p id="status" class="status" role="status" hidden></p>
    </main>
  </body>
</html>
