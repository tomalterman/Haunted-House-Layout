<text x="50" y="822" class="vt">SITE PLAN: GYM, 85 x 60 FT</text>
<text x="50" y="838" class="vs">Plan coordinates: x from the left wall, y from the top wall (stage along the bottom). Group 4 is the third lane.</text>
<text x="1110" y="80" class="vt" text-anchor="start" >WHAT IS BEING BUILT</text>
<text x="1110" y="100" class="lbl" text-anchor="start" >A booth behind the diagonal wall holds the 6.5 ft ball on a</text>
<text x="1110" y="114" class="lbl" text-anchor="start" >12 degree ramp. One pull on a cord drops a black kabuki drape</text>
<text x="1110" y="128" class="lbl" text-anchor="start" >and frees a hinged stop bar; the ball rolls over the 8 ft wall</text>
<text x="1110" y="142" class="lbl" text-anchor="start" >and drops into the front of the group 4 lane, then rolls down</text>
<text x="1110" y="156" class="lbl" text-anchor="start" >the lane after the group and stops at the stage end.</text>
<text x="1110" y="182" class="vt" text-anchor="start" >KEY NUMBERS</text>
<rect x="1110" y="192" width="460" height="184" class="tb"/>
<text x="1114" y="204" class="lblb" text-anchor="start" >Item</text>
<text x="1344" y="204" class="lblb" text-anchor="start" >Value</text>
<line x1="1110" y1="209" x2="1570" y2="209" class="tbl"/>
<text x="1114" y="219" class="lbl" text-anchor="start" >Opening center on the wall</text>
<text x="1344" y="219" class="lbl" text-anchor="start" >30'-10 7/8" from left end</text>
<line x1="1110" y1="224" x2="1570" y2="224" class="tbl"/>
<text x="1114" y="234" class="lbl" text-anchor="start" >Opening (clear)</text>
<text x="1344" y="234" class="lbl" text-anchor="start" >8'-0" wide x to 16'-3"</text>
<line x1="1110" y1="239" x2="1570" y2="239" class="tbl"/>
<text x="1114" y="249" class="lbl" text-anchor="start" >Booth (outside)</text>
<text x="1344" y="249" class="lbl" text-anchor="start" >11'-4" W x 11'-3" D x 17'-0"</text>
<line x1="1110" y1="254" x2="1570" y2="254" class="tbl"/>
<text x="1114" y="264" class="lbl" text-anchor="start" >Ramp</text>
<text x="1344" y="264" class="lbl" text-anchor="start" >8'-0" wide, 12 deg, 9'-11 5/8" long</text>
<line x1="1110" y1="269" x2="1570" y2="269" class="tbl"/>
<text x="1114" y="279" class="lbl" text-anchor="start" >Deck at lip / lane face</text>
<text x="1344" y="279" class="lbl" text-anchor="start" >8'-1" / 8'-3 5/8"</text>
<line x1="1110" y1="284" x2="1570" y2="284" class="tbl"/>
<text x="1114" y="294" class="lbl" text-anchor="start" >Deck at high end</text>
<text x="1344" y="294" class="lbl" text-anchor="start" >10'-1 7/8"</text>
<line x1="1110" y1="299" x2="1570" y2="299" class="tbl"/>
<text x="1114" y="309" class="lbl" text-anchor="start" >Ball center at rest</text>
<text x="1344" y="309" class="lbl" text-anchor="start" >12'-9 1/8" high</text>
<line x1="1110" y1="314" x2="1570" y2="314" class="tbl"/>
<text x="1114" y="324" class="lbl" text-anchor="start" >Kabuki drape</text>
<text x="1344" y="324" class="lbl" text-anchor="start" >10'-10" x 8'-9", hem 7'-9"</text>
<line x1="1110" y1="329" x2="1570" y2="329" class="tbl"/>
<text x="1114" y="339" class="lbl" text-anchor="start" >Operator platform</text>
<text x="1344" y="339" class="lbl" text-anchor="start" >4'-0" x 2'-5 1/2", top 5'-0"</text>
<line x1="1110" y1="344" x2="1570" y2="344" class="tbl"/>
<text x="1114" y="354" class="lbl" text-anchor="start" >Ball leaves lip</text>
<text x="1344" y="354" class="lbl" text-anchor="start" >2.6 s after the pull</text>
<line x1="1110" y1="359" x2="1570" y2="359" class="tbl"/>
<text x="1114" y="369" class="lbl" text-anchor="start" >Ball lands</text>
<text x="1344" y="369" class="lbl" text-anchor="start" >3.5 s, 6'-1 5/8" out from wall</text>
<text x="1110" y="396" class="vt" text-anchor="start" >SHEETS</text>
<text x="1110" y="416" class="lbl" text-anchor="start" >A-1  Site plan and key numbers</text>
<text x="1110" y="430" class="lbl" text-anchor="start" >A-2  Section A-A through the ramp</text>
<text x="1110" y="444" class="lbl" text-anchor="start" >A-3  Elevations from the lane</text>
<text x="1110" y="458" class="lbl" text-anchor="start" >A-4  Plan of the rig</text>
<text x="1110" y="472" class="lbl" text-anchor="start" >A-5  Mechanism details: stop bar and kabuki drop</text>
<text x="1110" y="486" class="lbl" text-anchor="start" >A-6  Rigging and the release sequence</text>
<text x="1110" y="500" class="lbl" text-anchor="start" >A-7  Framing, cut list, and hardware</text>
<text x="1110" y="514" class="lbl" text-anchor="start" >A-8  Operating, reset, and safety</text>
<text x="1110" y="538" class="lblb" text-anchor="start" >Conventions</text>
<text x="1110" y="552" class="lbl" text-anchor="start" >AFF = above finished floor (the gym floor).</text>
<text x="1110" y="566" class="lbl" text-anchor="start" >"Out" is measured square to the diagonal wall, toward the lane,</text>
<text x="1110" y="580" class="lbl" text-anchor="start" >from the wall centerline; the maze wall is 6 in thick, 8 ft tall.</text>
<text x="1110" y="594" class="lbl" text-anchor="start" >Lumber is nominal (2x4 = 1 1/2 x 3 1/2 in actual).</text>

