<text x="1080" y="80" class="vt" text-anchor="start" >KEYED NOTES</text>
<circle cx="1089" cy="98" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="102" class="lblb" text-anchor="middle" style="font-size:10px">1</text>
<text x="1106" y="102" class="lbl" text-anchor="start" >Kabuki drape: IFR black velour, chain in the hem pocket.</text>
<circle cx="1089" cy="118" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="122" class="lblb" text-anchor="middle" style="font-size:10px">2</text>
<text x="1106" y="122" class="lbl" text-anchor="start" >2x4 batten, flown on two lift lines, 6 kabuki pins (D3, D4).</text>
<circle cx="1089" cy="138" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="142" class="lblb" text-anchor="middle" style="font-size:10px">3</text>
<text x="1106" y="142" class="lbl" text-anchor="start" >2x6 outrigger, bolted to the booth corner post, pulley at end.</text>
<circle cx="1089" cy="158" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="162" class="lblb" text-anchor="middle" style="font-size:10px">4</text>
<text x="1106" y="162" class="lbl" text-anchor="start" >Return (beyond): 2x4 frame, black, closes the drape's sides.</text>
<circle cx="1089" cy="178" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="182" class="lblb" text-anchor="middle" style="font-size:10px">5</text>
<text x="1106" y="182" class="lbl" text-anchor="start" >Booth front lower wall: 2x4 @ 24" o.c. Beveled double top</text>
<text x="1106" y="195" class="lbl" text-anchor="start" >plate carries the deck's low end.</text>
<circle cx="1089" cy="211" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="215" class="lblb" text-anchor="middle" style="font-size:10px">6</text>
<text x="1106" y="215" class="lbl" text-anchor="start" >Maze wall (existing). Carries no rig load.</text>
<circle cx="1089" cy="231" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="235" class="lblb" text-anchor="middle" style="font-size:10px">7</text>
<text x="1106" y="235" class="lbl" text-anchor="start" >Lip: two layers 3/4" ply, bullnose edge, carpet wrapped.</text>
<circle cx="1089" cy="251" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="255" class="lblb" text-anchor="middle" style="font-size:10px">8</text>
<text x="1106" y="255" class="lbl" text-anchor="start" >Deck: 3/4" ply on 2x4 joists @ 16" o.c., down the slope.</text>
<circle cx="1089" cy="271" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="275" class="lblb" text-anchor="middle" style="font-size:10px">9</text>
<text x="1106" y="275" class="lbl" text-anchor="start" >Beam: (2) 2x6 on 4x4 posts, top beveled 12 deg.</text>
<circle cx="1089" cy="291" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="295" class="lblb" text-anchor="middle" style="font-size:10px">10</text>
<text x="1106" y="295" class="lbl" text-anchor="start" >4x4 ramp post, two per beam, 7'-6" apart (A-4).</text>
<circle cx="1089" cy="311" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="315" class="lblb" text-anchor="middle" style="font-size:10px">11</text>
<text x="1106" y="315" class="lbl" text-anchor="start" >Guide rail (beyond): 3/4" ply x 18", padded 2x4 cap.</text>
<circle cx="1089" cy="331" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="335" class="lblb" text-anchor="middle" style="font-size:10px">12</text>
<text x="1106" y="335" class="lbl" text-anchor="start" >Stop bar: 2x4 on edge, hinged, gravity latches (D1, D2).</text>
<circle cx="1089" cy="351" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="355" class="lblb" text-anchor="middle" style="font-size:10px">13</text>
<text x="1106" y="355" class="lbl" text-anchor="start" >Back stop: 2x4 on edge. Holds the ball while reloading.</text>
<circle cx="1089" cy="371" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="375" class="lblb" text-anchor="middle" style="font-size:10px">14</text>
<text x="1106" y="375" class="lbl" text-anchor="start" >Hoist pulley at 14'-6" on the back wall (reload).</text>
<circle cx="1089" cy="391" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="395" class="lblb" text-anchor="middle" style="font-size:10px">15</text>
<text x="1106" y="395" class="lbl" text-anchor="start" >Operator platform: 3/4" ply on 2x6, 4x4 legs, top 5'-0".</text>
<circle cx="1089" cy="411" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="415" class="lblb" text-anchor="middle" style="font-size:10px">16</text>
<text x="1106" y="415" class="lbl" text-anchor="start" >Booth back wall: 2x4 @ 24" o.c., built in two lifts.</text>
<circle cx="1089" cy="431" r="9" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="1089" y="435" class="lblb" text-anchor="middle" style="font-size:10px">17</text>
<text x="1106" y="435" class="lbl" text-anchor="start" >Guardrail 42" with mid rail. T-handle and cleat rail on it.</text>
<text x="1080" y="463" class="lblb" text-anchor="start" >Notes</text>
<text x="1080" y="477" class="lbl" text-anchor="start" >1. The booth stands on the floor behind the maze wall, its front</text>
<text x="1080" y="491" class="lbl" text-anchor="start" >   face against the wall's back face. Nothing bears on the wall.</text>
<text x="1080" y="505" class="lbl" text-anchor="start" >2. The lip layer clears the wall cap by 2 1/8" at the lane face.</text>
<text x="1080" y="519" class="lbl" text-anchor="start" >   Joists stop at the booth front wall; only the 1'-6" doubled</text>
<text x="1080" y="533" class="lbl" text-anchor="start" >   ply lip cantilevers over the wall.</text>
<text x="1080" y="547" class="lbl" text-anchor="start" >3. Heights are to the deck surface. Frame the deck, then cut</text>
<text x="1080" y="561" class="lbl" text-anchor="start" >   posts to suit and scribe to the floor.</text>
<text x="1080" y="575" class="lbl" text-anchor="start" >4. Snap the bar line on the ply, measured along the deck from</text>
<text x="1080" y="589" class="lbl" text-anchor="start" >   the lip (dimension above the deck).</text>
<text x="1080" y="603" class="lbl" text-anchor="start" >5. The ball clears the jambs by 9" each side and the header by</text>
<text x="1080" y="617" class="lbl" text-anchor="start" >   about 1'-5" as it rolls out.</text>
<text x="1080" y="631" class="lbl" text-anchor="start" >6. Paint everything a visitor could see flat black.</text>

<text x="1290" y="387" class="lblb" text-anchor="start" >Notes</text>
<text x="1290" y="401" class="lbl" text-anchor="start" >1. Booth front, jambs, and header are</text>
<text x="1290" y="415" class="lbl" text-anchor="start" >   framed like the maze walls and covered</text>
<text x="1290" y="429" class="lbl" text-anchor="start" >   in the same black sheeting.</text>
<text x="1290" y="443" class="lbl" text-anchor="start" >2. The drape fills the width between the</text>
<text x="1290" y="457" class="lbl" text-anchor="start" >   returns. With the returns, the lip</text>
<text x="1290" y="471" class="lbl" text-anchor="start" >   fillers, and the hem below the lip, it</text>
<text x="1290" y="485" class="lbl" text-anchor="start" >   closes every sight line from the lanes</text>
<text x="1290" y="499" class="lbl" text-anchor="start" >   (checked in the model from every route</text>
<text x="1290" y="513" class="lbl" text-anchor="start" >   position at 3'-6", 5'-6", 6'-6" eyes).</text>
<text x="1290" y="527" class="lbl" text-anchor="start" >3. Returns run from the hem to the booth</text>
<text x="1290" y="541" class="lbl" text-anchor="start" >   top, notched over the maze wall cap.</text>
<text x="1290" y="555" class="lbl" text-anchor="start" >4. Ball at rest: top at 16'-0", 5 ft back</text>
<text x="1290" y="569" class="lbl" text-anchor="start" >   from the opening. It only rolls down-</text>
<text x="1290" y="583" class="lbl" text-anchor="start" >   hill, so it never nears the header.</text>

<text x="860" y="348" class="lblb" text-anchor="start" >Notes</text>
<text x="860" y="362" class="lbl" text-anchor="start" >1. Set out the booth from the opening center on the wall</text>
<text x="860" y="376" class="lbl" text-anchor="start" >   (30'-10 7/8" from the diagonal wall's left end, sheet A-1).</text>
<text x="860" y="390" class="lbl" text-anchor="start" >   Snap a centerline square to the wall through that point.</text>
<text x="860" y="404" class="lbl" text-anchor="start" >2. The booth is a box on its own: front, two sides, and back</text>
<text x="860" y="418" class="lbl" text-anchor="start" >   wall frames, 2x4 at 24" o.c., corner posts tied together</text>
<text x="860" y="432" class="lbl" text-anchor="start" >   at the top. Brace and anchor it (A-7, A-8): it is 17 ft tall.</text>
<text x="860" y="446" class="lbl" text-anchor="start" >3. Joists run down the slope at 16" o.c. Two beams on 4x4</text>
<text x="860" y="460" class="lbl" text-anchor="start" >   posts and the booth front wall carry them.</text>
<text x="860" y="474" class="lbl" text-anchor="start" >4. The left side door opens out; keep the path to it clear.</text>
<text x="860" y="488" class="lbl" text-anchor="start" >5. The platform sits against the back wall, behind the deck's</text>
<text x="860" y="502" class="lbl" text-anchor="start" >   high end, so the operator's head is clear of the deck.</text>
<text x="860" y="516" class="lbl" text-anchor="start" >6. The landing zone and route are from the layout model;</text>
<text x="860" y="530" class="lbl" text-anchor="start" >   the dashed purple line is the visitor route.</text>

<text x="720" y="672" class="vt">D4  BATTEN, PINS, AND LINES (FRONT)</text>
<text x="720" y="688" class="vs">9/16 in = 1 ft. Line K runs along all 6 pins and out over the right outrigger; L1 and L2 fly the batten.</text>
<text x="720" y="728" class="vt" text-anchor="start" >HOW THE TRIGGER WORKS</text>
<text x="720" y="748" class="lbl" text-anchor="start" >1. Armed: the bar stands upright between the rails, held by two gravity latches. The ball rests against it and pushes with only</text>
<text x="720" y="762" class="lbl" text-anchor="start" >   about 2 1/2 lb (12 lb ball on a 12 deg slope), so the latches and the pull see very little load.</text>
<text x="720" y="776" class="lbl" text-anchor="start" >2. The drape hangs on 6 webbing loops, one over each kabuki pin. Every pin points the same way along the batten and is tied to line K.</text>
<text x="720" y="790" class="lbl" text-anchor="start" >3. The operator pulls one T-handle (A-6). Line K moves 3" and all 6 pins slide out of their loops together: the drape falls.</text>
<text x="720" y="804" class="lbl" text-anchor="start" >   Line B has 2" of extra slack, so it lifts the latch arms a moment later: the bar is free, the ball knocks it flat and rolls.</text>
<text x="720" y="818" class="lbl" text-anchor="start" >4. The drape is heaped on the lane floor in about 1 s; the ball reaches the drape line at about 2.6 s.</text>
<text x="720" y="832" class="lbl" text-anchor="start" >5. Reset: haul the ball up past the bar (line H), pull line R to stand the bar up (the latches click over it), ease the ball down</text>
<text x="720" y="846" class="lbl" text-anchor="start" >   onto the bar, trip the snap shackle, re-hang the drape on the lowered batten, fly it out, and set line K's slack. See A-8.</text>

<line x1="815" y1="526" x2="1597" y2="526" class="tbl"/>
<text x="819" y="536" class="lbl" text-anchor="start" >1/4" screw eyes</text>
<text x="1109" y="536" class="lbl" text-anchor="start" >14</text>
<text x="1179" y="536" class="lbl" text-anchor="start" >12 for kabuki pins, spares</text>
<line x1="815" y1="541" x2="1597" y2="541" class="tbl"/>
<text x="819" y="551" class="lbl" text-anchor="start" >1/4" smooth steel rod (kabuki pins)</text>
<text x="1109" y="551" class="lbl" text-anchor="start" >6</text>
<text x="1179" y="551" class="lbl" text-anchor="start" >4" long, one end bent to an eye</text>
<line x1="815" y1="556" x2="1597" y2="556" class="tbl"/>
<text x="819" y="566" class="lbl" text-anchor="start" >1 1/2" single pulley blocks</text>
<text x="1109" y="566" class="lbl" text-anchor="start" >8</text>
<text x="1179" y="566" class="lbl" text-anchor="start" >K, B, H, L1, L2 routing</text>
<line x1="815" y1="571" x2="1597" y2="571" class="tbl"/>
<text x="819" y="581" class="lbl" text-anchor="start" >1/4" braided polyester line, black</text>
<text x="1109" y="581" class="lbl" text-anchor="start" >200 ft</text>
<text x="1179" y="581" class="lbl" text-anchor="start" >all lines</text>
<line x1="815" y1="586" x2="1597" y2="586" class="tbl"/>
<text x="819" y="596" class="lbl" text-anchor="start" >Cleats</text>
<text x="1109" y="596" class="lbl" text-anchor="start" >4</text>
<text x="1179" y="596" class="lbl" text-anchor="start" >cleat rail on the platform guardrail</text>
<line x1="815" y1="601" x2="1597" y2="601" class="tbl"/>
<text x="819" y="611" class="lbl" text-anchor="start" >T-handle</text>
<text x="1109" y="611" class="lbl" text-anchor="start" >1</text>
<text x="1179" y="611" class="lbl" text-anchor="start" >pull handle, K and B tied off</text>
<line x1="815" y1="616" x2="1597" y2="616" class="tbl"/>
<text x="819" y="626" class="lbl" text-anchor="start" >Snap shackle with trip line</text>
<text x="1109" y="626" class="lbl" text-anchor="start" >1</text>
<text x="1179" y="626" class="lbl" text-anchor="start" >hoist line to ball net (reload)</text>
<line x1="815" y1="631" x2="1597" y2="631" class="tbl"/>
<text x="819" y="641" class="lbl" text-anchor="start" >Carpet</text>
<text x="1109" y="641" class="lbl" text-anchor="start" >8 x 2 ft</text>
<text x="1179" y="641" class="lbl" text-anchor="start" >wrap the lip</text>
<line x1="815" y1="646" x2="1597" y2="646" class="tbl"/>
<text x="819" y="656" class="lbl" text-anchor="start" >Lane camera + monitor</text>
<text x="1109" y="656" class="lbl" text-anchor="start" >1</text>
<text x="1179" y="656" class="lbl" text-anchor="start" >header camera, monitor on platform</text>
<line x1="815" y1="661" x2="1597" y2="661" class="tbl"/>
<text x="819" y="671" class="lbl" text-anchor="start" >Anchors / ballast</text>
<text x="1109" y="671" class="lbl" text-anchor="start" >as req.</text>
<text x="1179" y="671" class="lbl" text-anchor="start" >booth to floor or to framing, per owner</text>

<text x="50" y="90" class="lblb" text-anchor="start" >ARMING (BEFORE EACH GROUP)</text>
<text x="50" y="106" class="lbl" text-anchor="start" >1. Ball rests against the upright stop bar. Both latches down.</text>
<text x="50" y="122" class="lbl" text-anchor="start" >2. Drape hung on all 6 pins, batten flown to its stops, L1/L2 cleated.</text>
<text x="50" y="138" class="lbl" text-anchor="start" >3. Line K snug, line B with its 2" of slack, line R slack.</text>
<text x="50" y="154" class="lbl" text-anchor="start" >4. Hoist line H unclipped and pulled back into the booth.</text>
<text x="50" y="170" class="lbl" text-anchor="start" >5. Drape heap cleared from the lane. Lane clear.</text>
<text x="50" y="186" class="lbl" text-anchor="start" >6. Radio check with the lane wrangler: "Armed."</text>
<text x="50" y="218" class="lblb" text-anchor="start" >RELEASE RULE</text>
<text x="50" y="234" class="lbl" text-anchor="start" >Pull only when ALL of these are true on the monitor:</text>
<text x="50" y="250" class="lbl" text-anchor="start" >  - the group has walked well past the landing spot</text>
<text x="50" y="266" class="lbl" text-anchor="start" >    (about 10 ft past it, on toward the stage end);</text>
<text x="50" y="282" class="lbl" text-anchor="start" >  - nobody is entering from group 3 (the doorway is just</text>
<text x="50" y="298" class="lbl" text-anchor="start" >    a few feet from the landing spot);</text>
<text x="50" y="314" class="lbl" text-anchor="start" >  - no staff member is in the landing zone.</text>
<text x="50" y="330" class="lbl" text-anchor="start" >If in doubt, do not pull. Skipping one group is fine.</text>
<text x="50" y="362" class="lblb" text-anchor="start" >THE PULL</text>
<text x="50" y="378" class="lbl" text-anchor="start" >One smooth pull on the T-handle, about 6".</text>
<text x="50" y="394" class="lbl" text-anchor="start" >Call "Ball out." The wrangler steers the ball and keeps</text>
<text x="50" y="410" class="lbl" text-anchor="start" >the group moving toward the exit.</text>
<text x="50" y="442" class="lblb" text-anchor="start" >TIMING (SIMULATED)</text>
<text x="50" y="458" class="lbl" text-anchor="start" >Drape on the floor: about 1 s.</text>
<text x="50" y="474" class="lbl" text-anchor="start" >Ball leaves the lip: 2.6 s. Lands: 3.5 s, at about 13 mph.</text>
<text x="50" y="490" class="lbl" text-anchor="start" >Rolls down the lane at about walking pace and stops at</text>
<text x="50" y="506" class="lbl" text-anchor="start" >the stage end within about a minute.</text>
<text x="570" y="90" class="lblb" text-anchor="start" >RESET (BETWEEN GROUPS)</text>
<text x="570" y="106" class="lbl" text-anchor="start" >1. Wrangler walks the ball back up the lane to the wall</text>
<text x="570" y="122" class="lbl" text-anchor="start" >   under the opening.</text>
<text x="570" y="138" class="lbl" text-anchor="start" >2. Operator lowers line H from the hoist pulley; the wrangler</text>
<text x="570" y="154" class="lbl" text-anchor="start" >   clips the snap shackle to the ball's net.</text>
<text x="570" y="170" class="lbl" text-anchor="start" >3. Operator hauls the ball up the wall face, over the lip, and</text>
<text x="570" y="186" class="lbl" text-anchor="start" >   up the ramp past the flat stop bar to the back stop.</text>
<text x="570" y="202" class="lbl" text-anchor="start" >   Cleat line H.</text>
<text x="570" y="218" class="lbl" text-anchor="start" >4. Pull line R: the bar stands up and the latches click over it.</text>
<text x="570" y="234" class="lbl" text-anchor="start" >   Check both latch arms are down.</text>
<text x="570" y="250" class="lbl" text-anchor="start" >5. Ease line H until the ball rests on the bar. Pull the trip</text>
<text x="570" y="266" class="lbl" text-anchor="start" >   line to open the snap shackle; pull line H back.</text>
<text x="570" y="282" class="lbl" text-anchor="start" >6. Lower the batten on L1/L2 to about 6 ft over the lane.</text>
<text x="570" y="298" class="lbl" text-anchor="start" >   The wrangler picks up the drape and hooks its 6 loops on the</text>
<text x="570" y="314" class="lbl" text-anchor="start" >   pins (each pin pushed through both eyes and its loop).</text>
<text x="570" y="330" class="lbl" text-anchor="start" >7. Fly the batten back to its stops, cleat L1/L2.</text>
<text x="570" y="346" class="lbl" text-anchor="start" >8. Take up line K so the pins are snug; set line B's 2" slack.</text>
<text x="570" y="362" class="lbl" text-anchor="start" >9. Clear the lane, then arm (left column).</text>
<text x="570" y="394" class="lbl" text-anchor="start" >Time the reset in rehearsal; it must fit the gap between</text>
<text x="570" y="410" class="lbl" text-anchor="start" >groups. A second ball and drape would halve it.</text>
<text x="1090" y="90" class="lblb" text-anchor="start" >SAFETY</text>
<text x="1090" y="106" class="lbl" text-anchor="start" >- Landing zone: the ball lands at about 13 mph on the route's</text>
<text x="1090" y="122" class="lbl" text-anchor="start" >  turn corner. The release rule is the main safeguard.</text>
<text x="1090" y="138" class="lbl" text-anchor="start" >- Wrangler in the lower lane, in black, on the radio.</text>
<text x="1090" y="154" class="lbl" text-anchor="start" >- Booth: 17 ft tall on a small footprint. Brace all four</text>
<text x="1090" y="170" class="lbl" text-anchor="start" >  walls, tie the corner posts at the top, and anchor or</text>
<text x="1090" y="186" class="lbl" text-anchor="start" >  ballast the base. Agree the method with the maze owner.</text>
<text x="1090" y="202" class="lbl" text-anchor="start" >- No rig load on the maze wall.</text>
<text x="1090" y="218" class="lbl" text-anchor="start" >- Platform guardrail 42" with mid rail on open sides.</text>
<text x="1090" y="234" class="lbl" text-anchor="start" >- Drape and booth fabric: inherently flame-retardant</text>
<text x="1090" y="250" class="lbl" text-anchor="start" >  (NFPA 701). Ask the fire marshal early.</text>
<text x="1090" y="266" class="lbl" text-anchor="start" >- No exposed screws or staples where the ball touches:</text>
<text x="1090" y="282" class="lbl" text-anchor="start" >  deck, rails, lip, booth edges. Carpet the lip.</text>
<text x="1090" y="298" class="lbl" text-anchor="start" >- Keep hands clear of the bar when latching it; load the</text>
<text x="1090" y="314" class="lbl" text-anchor="start" >  ball only after the bar is latched (step 4 then 5).</text>
<text x="1090" y="330" class="lbl" text-anchor="start" >- The fallen drape is a trip hazard: clear it before the</text>
<text x="1090" y="346" class="lbl" text-anchor="start" >  next group enters.</text>
<text x="1090" y="378" class="lblb" text-anchor="start" >TEST BEFORE ANY SHOW</text>
<text x="1090" y="394" class="lbl" text-anchor="start" >1. Pull 20 times without the ball: all pins and both latches</text>
<text x="1090" y="410" class="lbl" text-anchor="start" >   release every time, in order (drape, then bar).</text>
<text x="1090" y="426" class="lbl" text-anchor="start" >2. 10 releases with the ball and nobody in the lane. Mark the</text>
<text x="1090" y="442" class="lbl" text-anchor="start" >   landing spot; compare with A-1 (within about 1 1/2 ft).</text>
<text x="1090" y="458" class="lbl" text-anchor="start" >3. Walk the route at kid and adult eye height with show</text>
<text x="1090" y="474" class="lbl" text-anchor="start" >   lighting: nothing of the rig shows.</text>
<text x="1090" y="490" class="lbl" text-anchor="start" >4. Rehearse the reset with the real crew and time it.</text>
